trigger:
  branches:
    include:
      - main

pr:
  - main

pool:
  vmImage: ubuntu-24.04

variables:
  nodeVersion: '20.x'

steps:
  - task: UseNode@1
    displayName: 'Install Node.js'
    inputs:
      version: $(nodeVersion)

  - script: |
      node --version
      npm --version
    displayName: 'Check Node.js and npm'

  - script: npm ci --ignore-scripts --dry-run
    displayName: 'Install dependencies'

  - script: npm run lint --if-present
    displayName: 'Run code quality checks'

  - script: npm test
    displayName: 'Run tests'

  - task: PublishTestResults@2
    displayName: 'Publish test results'
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: 'test-results/test-results.xml'
      failTaskOnFailedTests: true
