
trigger:
  branches:
    include:
      - main

pr:
  - main

pool:
  vmImage: ubuntu-24.04

variables:
  nodeVersion: '20.x'

steps:
  - task: UseNode@1
    displayName: 'Install Node.js'
    inputs:
      version: $(nodeVersion)

  - script: |
      node --version
      npm --version
    displayName: 'Check Node.js and npm'

  - script: npm ci
    displayName: 'Install dependencies'

  - script: npm run lint --if-present
    displayName: 'Run code quality checks'
